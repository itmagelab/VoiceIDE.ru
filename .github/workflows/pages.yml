name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# не запускать вторую выкладку, пока предыдущая ещё идёт
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # раскладываем в корень репозитория только файлы сайта,
      # чтобы в артефакт не попали .git и служебные каталоги
      - name: Collect site files
        run: |
          mkdir -p _site/assets
          cp index.html .nojekyll _site/
          cp assets/style.css assets/main.js _site/assets/
          cp -R assets/img _site/assets/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4